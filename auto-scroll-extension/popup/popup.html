<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto Scroller</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Auto Scroller</h1>

  <label for="amount">Scroll amount (px per tick)</label>
  <input type="number" id="amount" min="1" value="300" />

  <label for="speed">Speed (ms between ticks)</label>
  <input type="number" id="speed" min="10" value="200" />

  <div class="buttons">
    <button id="startBtn" class="primary">Start</button>
    <button id="stopBtn" class="danger">Stop</button>
  </div>

  <hr />

  <button id="extractBtn" class="secondary">Extract page HTML</button>

  <p id="status">Idle</p>

  <script src="popup.js"></script>
</body>
</html>
